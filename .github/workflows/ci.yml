name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Unused code
        run: |
          out=$(go run golang.org/x/tools/cmd/deadcode@latest ./cmd/kino)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
